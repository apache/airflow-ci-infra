---
# One grouped pull request per ecosystem and week. The cooldown keeps a release out until it has
# been public for a week, so a compromised or yanked release is usually caught before it lands.
version: 2
updates:
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pre-commit:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directories:
      - /
      - /lambdas/scale_out_runner
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ["*"]

  # Updates the providers in .terraform.lock.hcl and the version constraints in version.tf. A
  # terraform/runs-on change is planned on its pull request and applied after merge, behind the
  # runs-on-prod approval.
  - package-ecosystem: terraform
    directories:
      - /terraform/runs-on
      - /terraform/runs-on-access
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      terraform:
        patterns: ["*"]
