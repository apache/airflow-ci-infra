---
# Plans terraform/runs-on-flex on pull requests and on main; applies the plan made on main once a
# required reviewer approves the runs-on-prod environment. Same flow as terraform-runs-on.yml; the
# AWS roles live in terraform/runs-on-access and are applied by hand.
name: Terraform (RunsOn Flex)

on:  # yamllint disable-line rule:truthy
  pull_request:
    paths:
      - "terraform/runs-on-flex/*.tf"
      - "terraform/runs-on-flex/.terraform.lock.hcl"
      - ".github/workflows/terraform-runs-on-flex.yml"
      # Pull requests only: a plan proves the plan role still admits pull requests after an account
      # admin applied the changed trust policies by hand. On main the change needs no apply.
      - "terraform/runs-on-access/*.tf"
  push:
    branches: [main]
    paths:
      - "terraform/runs-on-flex/*.tf"
      - "terraform/runs-on-flex/.terraform.lock.hcl"
      - ".github/workflows/terraform-runs-on-flex.yml"

permissions: {}

concurrency:
  group: terraform-runs-on-flex-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: us-east-2
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  plan:
    # Fork pull requests get no OIDC token, so they cannot plan.
    if: >-
      github.event_name == 'push' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-slim
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/runs-on-flex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::827901512104:role/runs-on-terraform-flex-plan
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - run: terraform init -lockfile=readonly
      # The plan role cannot write the lock file; apply takes the lock and refuses a stale plan.
      - run: terraform plan -lock=false -out=runs-on-flex.tfplan
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: runs-on-flex-tfplan
          path: terraform/runs-on-flex/runs-on-flex.tfplan
          retention-days: 7

  apply:
    needs: plan
    if: github.event_name == 'push'
    # Not ubuntu-slim: its 15-minute job limit is shorter than creating the stack may take, and a
    # killed apply leaves the state lock held.
    runs-on: ubuntu-24.04
    # Required reviewers and the main-only branch policy come from .asf.yaml.
    environment: runs-on-prod
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/runs-on-flex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: arn:aws:iam::827901512104:role/runs-on-terraform-flex-apply
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - run: terraform init -lockfile=readonly
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: runs-on-flex-tfplan
          path: terraform/runs-on-flex
      - run: terraform apply runs-on-flex.tfplan
