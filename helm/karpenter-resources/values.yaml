---
clusterName: airflow-ci

# Must match node_iam_role_name in terraform/eks/karpenter.tf.
nodeIamRoleName: airflow-ci-runner-node

# Root volume for runner nodes: CI image + KinD images + parallel compose
# stacks need far more than the 20Gi AL2023 default (the previous runners had 256GB).
nodeVolumeSize: 200Gi

# Upper bound on total simultaneously provisioned runner capacity
# (~100 concurrent 32-vCPU runner nodes).
amdPoolCpuLimit: "3200"
# On-demand shared pool (small/medium classes): sized for the measured
# full-matrix peak (~60 nodes averaging well under 48 vCPU each).
amdSharedPoolCpuLimit: "2000"
# ARM (Graviton) pools mirror the AMD split; experiment-sized like amd was.
armPoolCpuLimit: "3200"
armSharedPoolCpuLimit: "2000"
