{{/*
 On-demand pool for the bin-packed small/medium runner classes. Shared nodes
 concentrate many jobs, so a single spot reclaim kills them all at once and a
 rerun re-packs the same jobs into the same vulnerable shape (measured
 2026-07-27/28: reclaim storms of 5-57 events wiped whole retry batches
 repeatedly; the on-demand premium is ~$1.5-2 per run). The xl class stays on
 the spot-first `ci-arm` pool: one job per node, so reclaims stay cheap,
 independent retries.
*/}}
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: ci-arm-shared
spec:
  template:
    metadata:
      labels:
        airflow-ci/pool: arm-shared
    spec:
      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: ci
      taints:
        - key: airflow-ci/runner
          effect: NoSchedule
      requirements:
        - key: kubernetes.io/arch
          operator: In
          values: ["arm64"]
        - key: kubernetes.io/os
          operator: In
          values: ["linux"]
        - key: karpenter.sh/capacity-type
          operator: In
          values: ["on-demand"]
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values: ["c6g", "c7g", "c8g", "m6g", "m7g", "m8g", "r6g", "r7g", "r8g"]
        - key: karpenter.k8s.aws/instance-cpu
          operator: In
          values: ["8", "16", "32", "48"]
  disruption:
    consolidationPolicy: WhenEmpty
    consolidateAfter: 60s
  limits:
    cpu: {{ .Values.armSharedPoolCpuLimit | quote }}
