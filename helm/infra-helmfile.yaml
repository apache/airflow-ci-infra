---
releases:
  - name: cluster-config
    chart: ./cluster-config
    namespace: kube-system

  # https://karpenter.sh/docs/getting-started/
  # IAM/SQS for Karpenter comes from terraform/eks/karpenter.tf (Pod Identity).
  - name: karpenter
    chart: oci://public.ecr.aws/karpenter/karpenter
    namespace: kube-system
    version: 1.11.3
    values:
      - ./values/karpenter.yaml

  # NodePool/EC2NodeClass CRs — depends on the Karpenter CRDs.
  - name: karpenter-resources
    chart: ./karpenter-resources
    namespace: kube-system
    needs:
      - kube-system/karpenter
    # On a fresh cluster the CRDs don't exist until the karpenter release above
    # installs, so the upfront diff/validation of this release must be skipped.
    disableValidationOnInstall: true
